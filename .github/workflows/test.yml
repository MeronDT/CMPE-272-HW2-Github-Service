name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx python-dotenv pydantic pytest pytest-cov respx

      - name: Run unit tests
        run: pytest tests/test_routes.py tests/test_webhook.py --cov=app --cov-report=term-missing